
name: CD Build and Push



on:

  push:

    branches: [main]

  workflow_dispatch:



env:

  REGISTRY: ghcr.io

  IMAGE_PREFIX: ${{ github.repository_owner }}/tenant-landlord-system



jobs:

  build-common:

    name: Build common library

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4

        with:

          java-version: "17"

          distribution: temurin

          cache: maven

      - name: Build and install common

        run: mvn -B -ntp -f common/pom.xml clean install -Dmaven.test.skip=true

      - uses: actions/upload-artifact@v4

        with:

          name: common-m2-repo

          path: ~/.m2/repository/com/platform/common/

          retention-days: 1



  build-and-push:

    name: Build and push

    needs: build-common

    runs-on: ubuntu-latest

    permissions:

      contents: read

      packages: write

    strategy:

      fail-fast: false

      matrix:

        service:

          - auth-service

          - lease-service

          - property-management-service

          - payment-service

          - mpesa-service

          - notification-engine

          - maintainance-ticket-service

          - gateway-service

          - eureka-server

          - nginx

    steps:

      - uses: actions/checkout@v4

      - if: matrix.service != 'nginx'

        uses: actions/setup-java@v4

        with:

          java-version: "17"

          distribution: temurin

          cache: maven

      - if: matrix.service != 'nginx'

        uses: actions/download-artifact@v4

        with:

          name: common-m2-repo

          path: ~/.m2/repository/com/platform/common/

      - if: matrix.service != 'nginx'

        name: Build jar

        working-directory: ${{ matrix.service }}

        run: mvn -B -ntp clean package -Dmaven.test.skip=true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3

        with:

          registry: ${{ env.REGISTRY }}

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta

        uses: docker/metadata-action@v5

        with:

          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}

          tags: |

            type=ref,event=branch

            type=sha,prefix=sha-

            type=raw,value=latest

      - uses: docker/build-push-action@v5

        with:

          context: ./${{ matrix.service }}

          file: ./${{ matrix.service }}/Dockerfile

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max

