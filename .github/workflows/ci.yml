
name: CI Build and Test



on:

  push:

    branches: [main, develop]

  pull_request:

    branches: [main, develop]



env:

  JAVA_VERSION: "17"



jobs:

  build-common:

    name: Build common library

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4

        with:

          java-version: "17"

          distribution: temurin

          cache: maven

      - name: Build and install common

        run: mvn -B -ntp -f common/pom.xml clean install -Dmaven.test.skip=true

      - uses: actions/upload-artifact@v4

        with:

          name: common-m2-repo

          path: ~/.m2/repository/com/platform/common/

          retention-days: 1



  build-and-test:

    name: Build and test

    needs: build-common

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      matrix:

        service:

          - auth-service

          - lease-service

          - property-management-service

          - payment-service

          - mpesa-service

          - notification-engine

          - maintainance-ticket-service

          - gateway-service

          - eureka-server

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4

        with:

          java-version: "17"

          distribution: temurin

          cache: maven

      - uses: actions/download-artifact@v4

        with:

          name: common-m2-repo

          path: ~/.m2/repository/com/platform/common/

      - name: Build

        working-directory: ${{ matrix.service }}

        run: mvn -B -ntp clean package -Dmaven.test.skip=true

