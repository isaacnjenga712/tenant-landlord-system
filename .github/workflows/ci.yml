
name: CI Build and Test



on:

  push:

    branches:

      - main

      - develop

  pull_request:

    branches:

      - main

      - develop



env:

  JAVA_VERSION: "17"



jobs:

  build-and-test:

    name: Build and test

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      matrix:

        service:

          - auth-service

          - lease-service

          - property-management-service

          - payment-service

          - mpesa-service

          - notification-engine

          - maintainance-ticket-service

          - gateway-service

    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Set up JDK

        uses: actions/setup-java@v4

        with:

          java-version: "17"

          distribution: temurin

          cache: maven



      - name: Build

        working-directory: ${{ matrix.service }}

        run: mvn -B -ntp clean package -Dmaven.test.skip=true

