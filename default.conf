# ============================================================
# nginx/conf.d/default.conf — edge routing to the API gateway
# ============================================================
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options nosniff          always;
    add_header X-Frame-Options        SAMEORIGIN       always;
    add_header X-XSS-Protection       "1; mode=block"  always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ============================================================
    # Health check endpoint
    # ============================================================
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ============================================================
    # Deny actuator from external access
    # ============================================================
    location ~ /actuator/ {
        deny all;
        return 404;
    }

    # ============================================================
    # Safaricom Daraja callback — bypasses the gateway
    # Safaricom sends no JWT and no X-Tenant-ID, so it must be
    # routed directly to mpesa-service.
    # ============================================================
    location = /api/payments/callback {
        limit_req  zone=mpesa_limit burst=50 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://mpesa_direct/api/payments/callback;
    }

    # ============================================================
    # WebSocket handshake — bypasses the gateway
    # Keeps the long-lived connection off the gateway's event loop.
    # ============================================================
    location /ws/notifications/ {
        proxy_pass         http://notification_ws/ws/notifications/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Tenant-ID       $http_x_tenant_id;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ============================================================
    # Auth login — tighter rate limit at the edge
    # (Gateway has its own Redis-backed limiter too)
    # ============================================================
    location = /api/auth/login {
        limit_req  zone=login_limit burst=10 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://api_gateway;
    }

    # ============================================================
    # All other /api/* traffic → gateway
    # Gateway handles: JWT validation, X-Tenant-ID enforcement,
    # circuit breaking, Redis rate limiting, path rewrites.
    # ============================================================
    location /api/ {
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://api_gateway;
    }

    # ============================================================
    # Default
    # ============================================================
    location / {
        return 404;
    }

    error_page 404 = @notfound;
    location @notfound {
        default_type application/json;
        return 404 '{"error":"not_found","message":"The requested resource does not exist"}\n';
    }

    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type application/json;
        return 429 '{"error":"rate_limited","message":"Too many requests, please slow down"}\n';
    }

    error_page 502 503 504 = @upstream_error;
    location @upstream_error {
        default_type application/json;
        return 502 '{"error":"upstream_unavailable","message":"Service temporarily unavailable"}\n';
    }
}