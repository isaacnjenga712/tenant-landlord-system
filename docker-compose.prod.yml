
# ============================================================================

# Production overrides.

#

# Usage:

#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

#

# Key differences from dev:

#   - No internal service ports exposed (only gateway:8080 and nginx:80/443)

#   - JVM flags tuned for containers (-XX:+UseContainerSupport)

#   - restart: always on everything

#   - Slightly smaller heap to fit more containers on one host

# ============================================================================



services:



  eureka-server:

    environment:

      SPRING_PROFILES_ACTIVE: prod

    ports: []

    restart: always



  postgres:

    environment:

      POSTGRES_DB: "${POSTGRES_DB:?required}"

      POSTGRES_USER: "${POSTGRES_USER:?required}"

      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"

    ports: []

    restart: always



  redis:

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}", "--appendonly", "yes"]

    ports: []

    restart: always



  mongodb:

    environment:

      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:?required}"

      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?required}"

    ports: []

    restart: always



  kafka:

    ports: []

    restart: always



  prometheus:

    ports: []

    restart: always



  grafana:

    environment:

      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?required}"

      GF_USERS_ALLOW_SIGN_UP: "false"

    ports: []

    restart: always



  zipkin:

    ports: []

    restart: always



  kafka-exporter:

    ports: []

    restart: always



  node-exporter:

    ports: []

    restart: always



  auth-service:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports: []

    restart: always



  lease-service:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports: []

    restart: always



  property-management-service:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports: []

    restart: always



  maintainance-ticket-service:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports: []

    restart: always



  payment-service:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports: []

    restart: always



  mpesa-service:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports: []

    restart: always



  notification-engine:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports: []

    restart: always



  admin-service:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports: []

    restart: always



  gateway-service:

    environment:

      SPRING_PROFILES_ACTIVE: prod

      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?required}"

      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    ports:

      - "127.0.0.1:8080:8080"     # loopback only — nginx proxies to it

    restart: always



  nginx:

    ports:

      - "80:80"

      - "443:443"

    volumes:

      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"

      - "./nginx/conf.d:/etc/nginx/conf.d:ro"

      - "./nginx/certs:/etc/nginx/certs:ro"

      - "./frontend/dist:/usr/share/nginx/html:ro"

    restart: always

