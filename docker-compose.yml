
version: '3.8'

services:

  nginx:

    image: nginx:alpine

    ports: ["80:80"]

    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro", "./nginx/conf.d:/etc/nginx/conf.d:ro"]

    depends_on: [gateway_service, auth_service]

  gateway_service:

    build: ./gateway-service

    ports: ["8080:8080"]

    environment: [JWT_SECRET=${JWT_SECRET}, REDIS_HOST=redis]

    depends_on: [redis, auth_service]

  auth_service:

    build: ./auth-service

    environment: [JWT_SECRET=${JWT_SECRET}, SPRING_PROFILES_ACTIVE=docker]

  redis:

    image: redis:7-alpine

    ports: ["6379:6379"]

  postgres:

    image: postgres:15-alpine

    environment: [POSTGRES_DB=rentflow, POSTGRES_USER=rentflow, POSTGRES_PASSWORD=rentflow]

    ports: ["5432:5432"]

    volumes: [pgdata:/var/lib/postgresql/data]

volumes:

  pgdata:

