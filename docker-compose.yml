services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres:
    image: "postgres:15"
    container_name: "postgres-db"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "apex123"
      POSTGRES_DB: "tenant_landlord_auth"
    ports:
      - "5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - "./postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    networks:
      - "lease-network"

  mongodb:
    image: "mongo:7.0"
    container_name: "mongodb"
    ports:
      - "27017:27017"
    volumes:
      - "mongo_data:/data/db"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    networks:
      - "lease-network"

  redis:
    image: "redis:7-alpine"
    container_name: "redis"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: "10s"
      timeout: "3s"
      retries: 5
    networks:
      - "lease-network"

  zookeeper:
    image: "confluentinc/cp-zookeeper:latest"
    container_name: "zookeeper"
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    ports:
      - "2181:2181"
    networks:
      - "lease-network"

  kafka:
    image: "confluentinc/cp-kafka:7.4.0"
    container_name: "kafka"
    depends_on:
      - "zookeeper"
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - "lease-network"

  # ============================================================
  # MICROSERVICES
  # ============================================================

  auth-service:
    build:
      context: "./auth-service"
      dockerfile: "Dockerfile"
    container_name: "auth-service"
    depends_on:
      postgres:
        condition: "service_healthy"
      kafka:
        condition: "service_started"
    ports:
      - "8090:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/tenant_landlord_auth"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "apex123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: "classpath:db/migration"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_CONSUMER_GROUP_ID: "auth-service-group"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      APP_KAFKA_TOPIC_USER_EVENTS: "auth.user.events"
      APP_KAFKA_OUTBOX_ENABLED: "true"
      APP_KAFKA_OUTBOX_BATCH_SIZE: "100"
      APP_KAFKA_OUTBOX_FIXED_DELAY_MS: "5000"
      APP_KAFKA_OUTBOX_INITIAL_DELAY_MS: "10000"
      JWT_ACCESS_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      JWT_REFRESH_SECRET: "607164346A576E5A7234753778217A25432A462D4A614E645267556B587032"
      LOG_LEVEL_COM_APEX_AUTH: "DEBUG"
      LOG_LEVEL_KAFKA: "INFO"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "40s"
    networks:
      - "lease-network"

  mpesa-service:
    build:
      context: "./mpesa-service"
      dockerfile: "Dockerfile"
    container_name: "mpesa-service"
    depends_on:
      postgres:
        condition: "service_healthy"
    ports:
      - "8089:8088"
    environment:
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/mpesa_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "apex123"
      DARAJA_BASE_URL: "https://sandbox.safaricom.co.ke"
      DARAJA_OAUTH_URL: "https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials"
      DARAJA_STKPUSH_URL: "https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest"
      DARAJA_CONSUMER_KEY: "cUuP3qgfT3SgPrFXjFOb9lGVSps24RyfW3WZrNpwwprmmqAN"
      DARAJA_CONSUMER_SECRET: "dsLKHq7nDEoGx0ymMYAjTUpuhF5gc1I0bz33VL6I3TIPHzIGEwuu2fDiZfRRDuDY"
      DARAJA_PASSKEY: "bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919"
      DARAJA_SHORTCODE: "174379"
      DARAJA_CALLBACK_URL: "https://unguarded-cornhusk-impart.ngrok-free.dev/api/payments/callback"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: "classpath:db/migration"
      LOG_LEVEL_COM_APEX_MPESA: "DEBUG"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/actuator/health"]
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "40s"
    networks:
      - "lease-network"

  payment-service:
    build:
      context: "./payment-service"
      dockerfile: "Dockerfile"
    container_name: "payment-service"
    depends_on:
      postgres:
        condition: "service_healthy"
      kafka:
        condition: "service_started"
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/payment_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "apex123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      LOG_LEVEL_COM_APEX_PAYMENT: "DEBUG"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "40s"
    networks:
      - "lease-network"

  lease-service:
    build:
      context: "./lease-service"
      dockerfile: "Dockerfile"
    container_name: "lease-service"
    depends_on:
      postgres:
        condition: "service_healthy"
      kafka:
        condition: "service_started"
    ports:
      - "8085:8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/lease_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "apex123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "create"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      SPRING_KAFKA_ADMIN_AUTO_CREATE: "true"
      SPRING_KAFKA_CONSUMER_GROUP_ID: "lease-service-group"
      LOG_LEVEL_LEASE: "DEBUG"
      LOG_LEVEL_KAFKA: "INFO"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "40s"
    networks:
      - "lease-network"

  property-management-service:
    build:
      context: .
      dockerfile: ./property-management-service/Dockerfile
    container_name: "property-service"
    depends_on:
      postgres:
        condition: "service_healthy"
      kafka:
        condition: "service_started"
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/property_service_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "apex123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "create"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SERVER_PORT: "8082"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "40s"
    networks:
      - "lease-network"

  maintainance-ticket-service:
    build:
      context: .
      dockerfile: ./maintainance-ticket-service/Dockerfile
    container_name: "maintenance-service"
    depends_on:
      postgres:
        condition: "service_healthy"
      kafka:
        condition: "service_started"
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/ticket_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "apex123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "create"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SERVER_PORT: "8084"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "40s"
    networks:
      - "lease-network"

  notification-engine:
    build:
      context: "./notification-engine"
      dockerfile: "Dockerfile"
    container_name: "notification-engine"
    depends_on:
      mongodb:
        condition: "service_healthy"
      kafka:
        condition: "service_started"
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/notificationdb"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_MAIL_USERNAME: "isaackaruku029@gmail.com"
      SPRING_MAIL_PASSWORD: "svbq owho gsgq tzqr"
      SPRING_MAIL_HOST: "smtp.gmail.com"
      SPRING_MAIL_PORT: "587"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "40s"
    networks:
      - "lease-network"

  # ============================================================
  # API GATEWAY — sits between NGINX and the microservices
  # ============================================================
  gateway-service:
    build:
      context: "./gateway-service"
      dockerfile: "Dockerfile"
    container_name: "gateway-service"
    depends_on:
      redis:
        condition: "service_healthy"
      auth-service:
        condition: "service_started"
      lease-service:
        condition: "service_started"
      property-management-service:
        condition: "service_started"
      payment-service:
        condition: "service_started"
      mpesa-service:
        condition: "service_started"
      notification-engine:
        condition: "service_started"
      maintainance-ticket-service:
        condition: "service_started"
    ports:
      - "8088:8080"
    environment:
      SERVER_PORT: "8080"
      GATEWAY_PORT: "8080"

      # JWT (must match auth-service's secret)
      JWT_ACCESS_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      JWT_EXPIRATION: "86400000"

      # Downstream services
      AUTH_SERVICE_URL:          "http://auth-service:8080"
      LEASE_SERVICE_URL:         "http://lease-service:8081"
      PROPERTY_SERVICE_URL:      "http://property-service:8082"
      PAYMENT_SERVICE_URL:       "http://payment-service:8086"
      MPESA_SERVICE_URL:         "http://mpesa-service:8088"
      NOTIFICATION_SERVICE_URL:  "http://notification-engine:8080"
      TICKET_SERVICE_URL:        "http://maintenance-service:8084"

      # Redis
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""

      # CORS
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"

      # Logging
      LOG_LEVEL_GATEWAY: "INFO"
      LOG_LEVEL_APP: "DEBUG"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "40s"
    networks:
      - "lease-network"
    restart: unless-stopped

  # ============================================================
  # NGINX — edge proxy
  # ============================================================
  nginx:
    build:
      context: "./nginx"
      dockerfile: "Dockerfile"
    container_name: "landlord-nginx"
    depends_on:
      gateway-service:
        condition: "service_started"
      mpesa-service:
        condition: "service_started"
      notification-engine:
        condition: "service_started"
    ports:
      - "80:80"
    networks:
      - "lease-network"
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  lease-network:
    driver: "bridge"