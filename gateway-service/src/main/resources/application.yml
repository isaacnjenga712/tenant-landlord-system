# ============================================================
# gateway-service — Production Ready
# Java 17 | Spring Boot 3.3.4 | Spring Cloud Gateway 2023.0.2
# ============================================================

server:
  port: ${GATEWAY_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: gateway-service

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

  # ---------- Spring Cloud Gateway ----------
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowedHeaders: "*"
            exposedHeaders: X-Request-ID, X-Tenant-ID, X-User-Id, Authorization
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        # ============================================================
        # PUBLIC ROUTES — no JWT
        # ============================================================

        # ---- Auth Service ----
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8080}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 15
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST

        # ---- M-Pesa Callback — MUST be public, high burst ----
        - id: mpesa-callback-exact
          uri: ${MPESA_SERVICE_URL:http://mpesa-service:8088}
          predicates:
            - Path=/api/payments/callback
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            # No TenantFilter, no JwtAuthFilter — Safaricom can't send JWT

        # ============================================================
        # PROTECTED ROUTES — TenantFilter + JwtAuthFilter are GlobalFilters
        # (see filter/ package). They apply to every route not in PUBLIC_PATHS.
        # ============================================================

        # ---- M-Pesa API (internal) ----
        - id: mpesa-service
          uri: ${MPESA_SERVICE_URL:http://mpesa-service:8088}
          predicates:
            - Path=/api/mpesa/**
          filters:
            - RewritePath=/api/mpesa/(?<segment>.*), /api/payments/$\{segment}
            - name: CircuitBreaker
              args:
                name: mpesaCircuit
                fallbackUri: forward:/fallback/mpesa

        # ---- Property Service ----
        - id: property-service
          uri: ${PROPERTY_SERVICE_URL:http://property-service:8082}
          predicates:
            - Path=/api/properties/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: propertyCircuit
                fallbackUri: forward:/fallback/service

        # ---- Lease Service ----
        - id: lease-service
          uri: ${LEASE_SERVICE_URL:http://lease-service:8081}
          predicates:
            - Path=/api/leases/**
          filters:
            - name: CircuitBreaker
              args:
                name: leaseCircuit
                fallbackUri: forward:/fallback/service

        # ---- Payment Service ----
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8086}
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments/(?<segment>.*), /api/v1/$\{segment}

        # ---- Notification Engine (REST + WebSocket) ----
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-engine:8080}
          predicates:
            - Path=/api/notifications/**,/ws/notifications/**

        # ---- Maintenance Ticket Service ----
        - id: ticket-service
          uri: ${TICKET_SERVICE_URL:http://maintenance-service:8084}
          predicates:
            - Path=/api/tickets/**

      # HTTP client tuning
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        pool:
          max-connections: 500
          acquire-timeout: 45000
          type: ELASTIC

# ============================================================
# JWT — read by JwtAuthFilter
# ============================================================
jwt:
  access:
    secret: ${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:86400000}
    issuer: rentflow-gateway

# ============================================================
# Resilience4j Circuit Breakers
# ============================================================
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      mpesaCircuit:
        baseConfig: default
      propertyCircuit:
        baseConfig: default
      leaseCircuit:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true

# ============================================================
# Actuator
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  health:
    redis:
      enabled: true
    circuitbreakers:
      enabled: true

# ============================================================
# Logging
# ============================================================
logging:
  level:
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    org.springframework.data.redis: WARN
    com.rentflow.gateway: ${LOG_LEVEL_APP:DEBUG}
    io.github.resilience4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

---
# ============================================================
# Profile: prod
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: ${REDIS_HOST}
      ssl: true

logging:
  level:
    com.rentflow.gateway: INFO
    org.springframework.cloud.gateway: WARN