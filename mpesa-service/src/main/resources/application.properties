# ==============================
# Server
# ==============================
server.port=${SERVER_PORT:8088}
server.servlet.context-path=/

# ==============================
# Application
# ==============================
spring.application.name=mpesa-service

# ==============================
# Database (PostgreSQL)
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/rentflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rentflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rentflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.table=flyway_schema_history_mpesa

# ==============================
# Kafka - ADDED (MISSING BEFORE)
# ==============================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

spring.kafka.consumer.group-id=mpesa-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=paymentRequested:com.platform.common.events.payment.PaymentRequestedEvent,stkPushRequested:com.platform.common.events.mpesa.StkPushRequestedEvent

spring.kafka.listener.auto-startup=true
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.concurrency=3

# ==============================
# Eureka Client
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ==============================
# Daraja API Credentials - NEVER HARDCODDED
# ==============================
daraja.consumer.key=${DARAJA_CONSUMER_KEY:}
daraja.consumer.secret=${DARAJA_CONSUMER_SECRET:}
daraja.passkey=${DARAJA_PASSKEY:}
daraja.shortcode=${DARAJA_SHORTCODE:174379}
daraja.callback.url=${DARAJA_CALLBACK_URL:https://your-ngrok-id.ngrok-free.dev/api/payments/callback}

daraja.base.url=${DARAJA_BASE_URL:https://sandbox.safaricom.co.ke}
daraja.oauth.url=${DARAJA_OAUTH_URL:${daraja.base.url}/oauth/v1/generate?grant_type=client_credentials}
daraja.stkpush.url=${DARAJA_STKPUSH_URL:${daraja.base.url}/mpesa/stkpush/v1/processrequest}
daraja.stkpush.timeout=${DARAJA_TIMEOUT:30000}
daraja.callback.retry.max=${DARAJA_RETRY_MAX:3}

# 
# ==============================
# Actuator
# ==============================
management.endpoints.web.exposure.include=health,info,kafka
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.kafka.enabled=true
management.info.env.enabled=true

# ==============================
# Logging
# ==============================
logging.level.com.apex.mpesa=${LOG_LEVEL_COM_APEX_MPESA:DEBUG}
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.web=INFO