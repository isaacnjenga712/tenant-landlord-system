server {
    listen      80;
    listen      [::]:80;
    server_name _;

    add_header X-Content-Type-Options nosniff          always;
    add_header X-Frame-Options        SAMEORIGIN       always;
    add_header X-XSS-Protection       "1; mode=block"  always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";
    proxy_set_header X-Tenant-ID       $http_x_tenant_id;
    proxy_set_header X-Request-ID      $request_id;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ /actuator/ {
        deny all;
        return 404;
    }

    location = /api/auth/login {
        limit_req  zone=login_limit burst=10 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://auth-service:8080/api/auth/login;
    }

    location /api/auth/ {
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://auth-service:8080/api/auth/;
    }

    location /api/ {
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://gateway-service:8080;
    }

    location /ws/ {
        proxy_pass         http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ============================================================
    # Observability dashboards — internal only
    # In production, protect with auth or restrict by IP
    # ============================================================
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /zipkin/ {
        proxy_pass http://zipkin:9411/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }

    error_page 404 = @notfound;
    location @notfound {
        default_type application/json;
        return 404 '{"error":"not_found","message":"Resource not found"}\n';
    }

    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type application/json;
        return 429 '{"error":"rate_limited","message":"Too many requests"}\n';
    }

    error_page 502 503 504 = @upstream_error;
    location @upstream_error {
        default_type application/json;
        return 502 '{"error":"upstream_unavailable","message":"Service temporarily unavailable"}\n';
    }
}