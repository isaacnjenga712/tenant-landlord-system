
# ============================================================================

# RentFlow — TLS + reverse proxy for the Vue app and API.

#

# Expected certificate layout:

#   /etc/nginx/certs/fullchain.pem

#   /etc/nginx/certs/privkey.pem

#

# Generate self-signed for testing:

#   ./scripts/gen-cert.sh

#

# Production: use Let's Encrypt via Certbot (see scripts/deploy.sh).

# ============================================================================



# Redirect HTTP to HTTPS

server {

    listen 80;

    server_name _;

    return 301 https://$host$request_uri;

}



# HTTPS — API (api.yourdomain.com)

server {

    listen 443 ssl;

    http2 on;

    server_name api.yourdomain.com;



    ssl_certificate     /etc/nginx/certs/fullchain.pem;

    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;

    ssl_session_timeout 10m;



    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "DENY" always;



    client_max_body_size 10M;



    # Block internal API from the outside

    location /api/v1/internal/ {

        return 404;

    }



    # Block swagger in prod

    location ~ ^/(swagger-ui|v3/api-docs) {

        return 404;

    }



    # WebSocket upgrade for STOMP

    location /ws/ {

        proxy_pass http://gateway-service:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;

        proxy_send_timeout 3600s;

    }



    location / {

        proxy_pass http://gateway-service:8080;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;

        proxy_connect_timeout 10s;

    }

}



# HTTPS — Frontend (app.yourdomain.com)

server {

    listen 443 ssl;

    http2 on;

    server_name app.yourdomain.com yourdomain.com;



    ssl_certificate     /etc/nginx/certs/fullchain.pem;

    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers HIGH:!aNULL:!MD5;



    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "DENY" always;



    root /usr/share/nginx/html;

    index index.html;



    # Vue SPA fallback

    location / {

        try_files $uri $uri/ /index.html;

    }



    # Long cache for hashed assets

    location ~* /.(js|css|png|jpg|jpeg|svg|woff2|woff)$ {

        expires 1y;

        add_header Cache-Control "public, immutable";

    }



    # Never cache index.html

    location = /index.html {

        add_header Cache-Control "no-store, no-cache, must-revalidate";

    }

}

