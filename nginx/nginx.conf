user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time tenant=$http_x_tenant_id req_id=$request_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # ---------- WebSocket upgrade map ----------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- Docker DNS resolver ----------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------- Rate-limit zones ----------
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=mpesa_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_log_level notice;
    limit_conn_log_level notice;

    # ============================================================
    # Upstreams — NGINX only talks to 3 backends:
    #   1. gateway-service      (all /api/* traffic)
    #   2. mpesa-service        (Safaricom callback only)
    #   3. notification-engine  (WebSocket handshake only)
    # ============================================================
    upstream api_gateway {
        zone api_gateway 64k;
        server gateway-service:8080 resolve;
        keepalive 32;
    }

    upstream mpesa_direct {
        zone mpesa_direct 64k;
        server mpesa-service:8088 resolve;
        keepalive 16;
    }

    upstream notification_ws {
        zone notification_ws 64k;
        server notification-engine:8080 resolve;
        keepalive 16;
    }

    # ---------- Shared proxy defaults ----------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";
    proxy_set_header X-Tenant-ID       $http_x_tenant_id;
    proxy_set_header X-Request-ID      $request_id;

    include /etc/nginx/conf.d/*.conf;
}