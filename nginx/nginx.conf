
user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;

pid /var/run/nginx.pid;



events {

    worker_connections 2048;

    multi_accept on;

}



http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;



    log_format main '$remote_addr - $remote_user [$time_local] "$request" '

                    '$status $body_bytes_sent "$http_referer" '

                    '"$http_user_agent" "$http_x_forwarded_for" '

                    'rt=$request_time ut=$upstream_response_time';



    access_log /var/log/nginx/access.log main;



    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;

    server_tokens off;

    client_max_body_size 25m;



    gzip on;

    gzip_vary on;

    gzip_min_length 1024;

    gzip_types text/plain text/css application/json application/javascript

               text/xml application/xml application/xml+rss;



    map $http_upgrade $connection_upgrade {

        default upgrade;

        ""      close;

    }



    limit_req_zone $binary_remote_addr zone=api_limit:10m           rate=20r/s;

    limit_req_zone $binary_remote_addr zone=login_limit:10m         rate=5r/s;

    limit_req_zone $binary_remote_addr zone=mpesa_callback_limit:10m rate=50r/s;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;



    # Docker embedded DNS — allows lazy upstream resolution

    resolver 127.0.0.11 valid=10s ipv6=off;



    # NOTE: no upstream blocks. proxy_pass uses the service name directly.

    # nginx will resolve it at request time via the resolver above.



    include /etc/nginx/conf.d/*.conf;

}

