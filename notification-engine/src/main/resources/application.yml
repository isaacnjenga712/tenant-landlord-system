spring:
  application:
    name: notification-engine

  # ==================== MongoDB ====================
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/notificationdb}

  # ==================== Mail (SMTP) ====================
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:isaackaruku029@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:svbq owho gsgq tzqr}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

  # ==================== Thymeleaf ====================
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    check-existence: true

  # ==================== Kafka ====================
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "payment:com.property.notification.dto.PaymentEventDto,maintenance:com.property.notification.dto.MaintenanceEventDto"

# ==================== Custom Kafka topics ====================
app:
  kafka:
    topics:
      payment: payment-events
      maintenance: maintenance-events

# ==================== SMS Gateway ====================
sms:
  gateway:
    url: ${SMS_GATEWAY_URL:http://mock-sms-gateway/send}

# ==================== Resilience4j ====================
resilience4j:
  retry:
    instances:
      smsRetry:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - java.lang.RuntimeException

# ==================== Server ====================
server:
  port: ${SERVER_PORT:8080}

# ============================================================
# ✅ ACTUATOR — exposes /actuator/health and /actuator/info
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

# ==================== Logging ====================
logging:
  level:
    com.property.notification: ${LOG_LEVEL_NOTIFICATION:DEBUG}