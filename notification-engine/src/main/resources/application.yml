spring:
  application:
    name: notification-engine

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/notificationdb}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    check-existence: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:notification-engine-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # We consume raw JSON strings and parse manually in the listener.
      # (No JsonDeserializer, no type mappings — see KafkaConfig.consumerFactory)
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
      ack-mode: manual_immediate
      missing-topics-fatal: false
      concurrency: 5
      properties:
        max.poll.interval.ms: 300000
        max.poll.records: 50

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  kafka:
    topics:
      payment: payment-events
      maintenance: maintenance-events
      payment-received: payment.events.received
      payment-failed: payment.events.failed
      lease-created: lease.lease.created
      lease-terminated: lease.lease.terminated
      ticket-created: maintenance.ticket.created
      ticket-resolved: maintenance.ticket.resolved
      property-registered: property.property.registered
      user-events: auth.user.events
      mpesa-requested: mpesa.events.stk.requested
      mpesa-result: mpesa.events.stk.result
      notification-dlq: notification.events.dlq

# ── Channel gateways ───────────────────────────────────────────
# Leave URLs blank in dev — channels log only ([SMS MOCK] / [WHATSAPP MOCK]).
# Set real provider URLs in prod via env vars.
sms:
  gateway:
    url: ${SMS_GATEWAY_URL:}
    timeout: 5000
    retry-max: 3

whatsapp:
  gateway:
    url: ${WHATSAPP_GATEWAY_URL:}
  from: ${WHATSAPP_FROM:}

resilience4j:
  retry:
    instances:
      smsRetry:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - java.lang.RuntimeException
          - org.springframework.web.client.RestClientException
      emailRetry:
        maxAttempts: 3
        waitDuration: 3s
  circuitbreaker:
    instances:
      emailCB:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      smsCB:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,kafka,circuitbreakers,retries
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    mail:
      enabled: false
    mongo:
      enabled: true
    kafka:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${SPRING_PROFILES_ACTIVE:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 100ms,500ms,1s,5s
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
  info:
    env:
      enabled: true

logging:
  level:
    com.property.notification: ${LOG_LEVEL_NOTIFICATION:DEBUG}
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name},%X{traceId:-},%X{spanId:-}] - %msg%n"