
global:

  scrape_interval: 15s

  evaluation_interval: 15s

  external_labels:

    cluster: rentflow

    environment: dev



scrape_configs:

  - job_name: 'prometheus'

    static_configs:

      - targets: ['localhost:9090']



  - job_name: 'spring-microservices'

    metrics_path: '/actuator/prometheus'

    scrape_interval: 15s

    static_configs:

      - targets:

          - 'auth-service:8080'

          - 'lease-service:8081'

          - 'property-management-service:8082'

          - 'maintainance-ticket-service:8084'

          - 'payment-service:8086'

          - 'mpesa-service:8088'

          - 'notification-engine:8080'

          - 'gateway-service:8080'

          - 'eureka-server:8761'

        labels:

          stack: microservices



  - job_name: 'kafka-exporter'

    static_configs:

      - targets: ['kafka-exporter:9308']



  - job_name: 'node-exporter'

    static_configs:

      - targets: ['node-exporter:9100']

