# ===================================================================
# Server
# ===================================================================
server.port=${SERVER_PORT:8086}

# ===================================================================
# Application
# ===================================================================
spring.application.name=payment-service

# ===================================================================
# Database (PostgreSQL)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/rentflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rentflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rentflow}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================================================
# Flyway
# ===================================================================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.table=flyway_schema_history_payment

# ===================================================================
# Eureka Client
# ===================================================================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ===================================================================
# Kafka - FIXED FOR PAYMENTS (IDEMPOTENT + TRANSACTIONAL)
# ===================================================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

# Producer - MONEY MUST NOT BE LOST
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.transactional.id=payment-service-tx-
spring.kafka.producer.properties.retries=10
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000

# Consumer - PAYMENT CONFIRMATION
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=stkPushResult:com.platform.common.events.mpesa.StkPushResultEvent,leaseCreated:com.platform.common.events.lease.LeaseCreatedEvent
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.properties.max.poll.interval.ms=300000

# Listener
spring.kafka.listener.auto-startup=true
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.concurrency=3
spring.kafka.listener.type=single

# ===================================================================
# Payment App Topics
# ===================================================================
app.kafka.topics.payment-requested=payment.events.requested
app.kafka.topics.payment-confirmed=payment.events.confirmed
app.kafka.topics.payment-failed=payment.events.failed
app.kafka.topics.payment-due=payment.events.due
app.kafka.topics.mpesa-stk-requested=mpesa.events.stk.requested
app.kafka.topics.mpesa-stk-result=mpesa.events.stk.result
app.kafka.topics.dlq=payment.events.dlq

# Idempotency - prevent double payment
app.payment.idempotency.enabled=true
app.payment.idempotency.ttl-hours=24

# ===================================================================
# Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info,kafka,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.kafka.enabled=true
management.health.db.enabled=true
management.info.env.enabled=true

# ===================================================================
# Logging
# ===================================================================
logging.level.com.apex.PaymentService=${LOG_LEVEL_COM_APEX_PAYMENT:DEBUG}
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.web=INFO