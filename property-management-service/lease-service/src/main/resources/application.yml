spring:
  application:
    name: lease-service

  # ==================== DATASOURCE ====================
  datasource:
    # Use environment variable if provided, otherwise fallback to localhost:5000
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5000/lease_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:apex123}
    driver-class-name: org.postgresql.Driver

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        

# ==================== EUREKA (disabled) ====================
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ==================== SERVER ====================
server:
  port: ${SERVER_PORT:8083}